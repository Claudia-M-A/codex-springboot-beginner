name: Deploy to Elastic Beanstalk Java SE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    outputs:
      jar-name: ${{ steps.jar.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw clean test

      - name: Package application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./mvnw package -DskipTests

      - name: Verify and locate executable JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: jar
        shell: bash
        run: |
          mapfile -t jar_files < <(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print)
          if [[ "${#jar_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one executable JAR under target/, found ${#jar_files[@]}" >&2
            exit 1
          fi
          jar_file="${jar_files[0]}"
          main_class="$(unzip -p "$jar_file" META-INF/MANIFEST.MF | sed -n 's/^Main-Class: //p' | tr -d '\r')"
          if [[ "$main_class" != "org.springframework.boot.loader.launch.JarLauncher" ]]; then
            echo "JAR is not a repackaged executable Spring Boot JAR (Main-Class: $main_class)" >&2
            exit 1
          fi
          jar_entries="$(jar tf "$jar_file")"
          if ! grep -q '^BOOT-INF/classes/' <<< "$jar_entries" || ! grep -q '^BOOT-INF/lib/' <<< "$jar_entries"; then
            echo "JAR is missing Spring Boot application classes or runtime dependencies" >&2
            exit 1
          fi
          if ! grep -Eq '^BOOT-INF/lib/tomcat-embed-core-[^/]+\.jar$' <<< "$jar_entries"; then
            echo "JAR is missing the embedded Tomcat runtime required by the Java SE platform" >&2
            exit 1
          fi
          echo "path=$jar_file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_file")" >> "$GITHUB_OUTPUT"

      - name: Upload executable JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spring-boot-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: elasticbeanstalk-codex-springboot-beginner-env
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download executable JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spring-boot-jar
          path: target

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-2

      - name: Diagnose AWS and S3 access
        shell: bash
        env:
          EB_ARTIFACT_BUCKET: ${{ vars.EB_ARTIFACT_BUCKET }}
        run: |
          if [[ -z "$EB_ARTIFACT_BUCKET" ]]; then
            echo "GitHub Actions variable EB_ARTIFACT_BUCKET is not set" >&2
            exit 1
          fi

          aws sts get-caller-identity

          aws s3api head-bucket \
            --bucket "$EB_ARTIFACT_BUCKET"

          aws s3api get-bucket-location \
            --bucket "$EB_ARTIFACT_BUCKET"

      - name: Deploy JAR to the existing Elastic Beanstalk environment
        uses: aws-actions/aws-elasticbeanstalk-deploy@1f56e4e813ae4eb167e69ca324234c336c1df573 # v1.0.4
        with:
          aws-region: ap-southeast-2
          application-name: codex-springboot-beginner
          environment-name: codex-springboot-beginner-env
          deployment-package-path: target/${{ needs.build-and-test.outputs.jar-name }}
          version-label: ${{ github.sha }}
          s3-bucket-name: ${{ vars.EB_ARTIFACT_BUCKET }}
          create-application-if-not-exists: false
          create-environment-if-not-exists: false
          create-s3-bucket-if-not-exists: false
